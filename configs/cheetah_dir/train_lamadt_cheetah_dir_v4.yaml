experiment_name: "train_lamadt_cheetah_dir_v4"

model:
  name: "llama-3.2-1b"
  policy_lora:
    rank: 16
    alpha: 32
    dropout: 0.05
  init_from_shared_lora: "experiments/cheetah_dir/llm_objectives/checkpoints/lora_shared.pt"

data:
  offline_root: "data/offline/cheetah_dir"
  augmented_root: "data/augmented/cheetah_dir_v2"
  task_description_path: "data/task_descriptions/descriptions_cheetah_dir.json"
  state_dim: 20
  action_dim: 6

training:
  total_steps: 100000
  batch_size: 32
  lr: 5.0e-5
  weight_decay: 0.01
  warmup_steps: 2000
  gradient_accumulation: 2
  context_length: 20
  max_grad_norm: 1.0
  use_amp: true
  gradient_checkpointing: true

logging:
  log_every: 100
  save_every: 10000
  output_dir: "experiments/cheetah_dir/lamadt_policy_v4"
  seed: 42
